<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Outage Tracker — Australia</title>
<meta name="viewport" content="width=1440"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a18; min-height: 100vh; font-family: 'IBM Plex Sans', sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  input, select { font-family: inherit; outline: none; }
  input:focus, select:focus { border-color: currentColor; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.5); }
  #root { padding: 0; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="palettes.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="aus-map.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screen-overview.jsx"></script>
<script type="text/babel" src="screens-other.jsx"></script>

<script type="text/babel" data-presets="env,react">
// Set this to your backend URL to use real scraped data instead of mock data.
// Leave empty ('') to run in demo mode with generated data.
// Example: window.API_URL = 'https://your-app.railway.app';
window.API_URL = 'https://pandolardevgithubio-production.up.railway.app';

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "civic",
  "dark": true,
  "palette": "civic",
  "density": "compact",
  "pulse": true
}/*EDITMODE-END*/;

const VARIANT_INFO = {
  civic:     { label: 'Civic',     desc: 'Clean, calm, accessible — for the public' },
  ops:       { label: 'Ops',       desc: 'Coord ticks, dense, monitoring vibe' },
  editorial: { label: 'Editorial', desc: 'Big type, hatched fills, news-site feel' },
  cards:     { label: 'Cards',     desc: 'Card grid, breathable, scannable' },
  mapfirst:  { label: 'Map-first', desc: 'Full-bleed map, side panel for list' },
};

function App() {
  const { loading, error } = useOutageData();
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('overview');
  const [tab, setTab] = React.useState('live');
  const [filters, setFilters] = React.useState({ state: '', operator: '', cause: '', status: '', q: '' });
  const [selected, setSelected] = React.useState(null);
  const [selectedState, setSelectedState] = React.useState(null);

  const palette = (PALETTES[tweaks.palette] || PALETTES.civic)[tweaks.dark ? 'dark' : 'light'];
  const variant = tweaks.variant;

  const openIncident = (o) => setSelected(o);
  const closeIncident = () => setSelected(null);

  // when a state is clicked, switch to region screen
  const onSelectState = (code) => {
    setSelectedState(code);
    setScreen('region');
  };

  let body;
  if (screen === 'overview') {
    body = <OverviewScreen palette={palette} tab={tab} setTab={setTab}
              filters={filters} setFilters={setFilters}
              openIncident={openIncident} selected={selected}
              pulse={tweaks.pulse} density={tweaks.density}
              variant={variant}
              selectedState={selectedState} setSelectedState={onSelectState}/>;
  } else if (screen === 'region') {
    body = <RegionScreen palette={palette}
              selectedState={selectedState} setSelectedState={setSelectedState}
              openIncident={openIncident}
              density={tweaks.density} pulse={tweaks.pulse} variant={variant}/>;
  } else if (screen === 'lookup') {
    body = <LookupScreen palette={palette} openIncident={openIncident}/>;
  } else if (screen === 'alerts') {
    body = <AlertsScreen palette={palette}/>;
  } else if (screen === 'sources') {
    body = <SourcesScreen palette={palette}/>;
  }

  return (
    <>
      {error && (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999,
          background: '#7a2020', color: '#ffd', padding: '8px 16px',
          fontFamily: 'IBM Plex Mono, monospace', fontSize: 12, textAlign: 'center',
        }}>
          API unavailable — showing demo data. ({error})
        </div>
      )}
      {loading && !error && (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999,
          background: '#1a3a1a', color: '#afd', padding: '8px 16px',
          fontFamily: 'IBM Plex Mono, monospace', fontSize: 12, textAlign: 'center',
        }}>
          Fetching live outage data…
        </div>
      )}
      <div style={{ display: 'flex', height: '100vh', position: 'relative', background: palette.bg, fontFamily: 'IBM Plex Sans, sans-serif' }}
           data-screen-label={`01 ${screen}`}>
        <Sidebar screen={screen} setScreen={setScreen} palette={palette} variant={variant}/>
        <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
          {body}
          {selected && <IncidentPanel outage={selected} onClose={closeIncident} palette={palette}/>}
        </div>
      </div>

      <TweaksPanel title="Tweaks" defaultPosition={{ right: 20, top: 20 }}>
        <TweakSection title="Layout variant">
          <TweakSelect
            label="Variant"
            value={tweaks.variant}
            onChange={v => setTweak('variant', v)}
            options={Object.entries(VARIANT_INFO).map(([k, v]) => ({ value: k, label: v.label }))}/>
          <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 10, color: '#888', marginTop: -4, marginBottom: 4 }}>
            {VARIANT_INFO[tweaks.variant]?.desc}
          </div>
        </TweakSection>
        <TweakSection title="Theme">
          <TweakToggle label="Dark mode" value={tweaks.dark} onChange={v => setTweak('dark', v)}/>
          <TweakRadio label="Palette" value={tweaks.palette} onChange={v => setTweak('palette', v)}
            options={[{ value: 'civic', label: 'Civic' }, { value: 'warm', label: 'Warm' }, { value: 'mono', label: 'Mono' }]}/>
        </TweakSection>
        <TweakSection title="Map">
          <TweakToggle label="Live pulse" value={tweaks.pulse} onChange={v => setTweak('pulse', v)}/>
        </TweakSection>
        <TweakSection title="Density">
          <TweakRadio label="Rows" value={tweaks.density} onChange={v => setTweak('density', v)}
            options={[{ value: 'compact', label: 'Compact' }, { value: 'comfortable', label: 'Comfortable' }]}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
